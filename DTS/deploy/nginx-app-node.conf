# =============================================================================
# B 项目数字孪生可视化系统 —— app-node Nginx 站点配置（Nginx 1.24）
#
# 用途：把 pnpm build 产出的 apps/admin/dist 静态包发布到 node6，
#       并把 /api 反向代理到 node4/node5 的 Easegress 网关。
#
# 部署位置（openEuler）：/etc/nginx/conf.d/b-dt.conf
# 静态包目录：          /usr/share/nginx/b-dt  （内容 = apps/admin/dist）
# 改完执行：            nginx -t && systemctl reload nginx
# =============================================================================

# ---- Easegress 网关上游（按实际节点 IP / 监听端口修改；双入口可做负载）----
upstream b_dt_api {
    # server database-node:13009;   # TODO: 换成 Easegress 在 node4 的真实 IP:端口
    # server fabric-node:13009;   # TODO: 换成 Easegress 在 node5 的真实 IP:端口
    server 127.0.0.1:8080;       # 占位：未确定前先指向本机，避免配置报错
    keepalive 32;
}

server {
    listen       80;
    server_name  _;                       # 有域名/主机名时替换

    # ★根路径部署：静态包直接放在该目录（= apps/admin/dist 的全部内容）
    root   /usr/share/nginx/b-dt;
    index  index.html;

    charset utf-8;
    client_max_body_size 20m;

    # ---------- gzip 压缩（Cesium/JS 文本资源收益明显）----------
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/json application/javascript
                      application/wasm text/xml application/xml image/svg+xml;
    gzip_vary         on;

    # ---------- 安全/缓存响应头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # ---------- 后端 API：同源反代到 Easegress ----------
    location /api/ {
        proxy_pass         http://b_dt_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- WebSocket（接入 RocketMQ 实时推送时启用，地址按实际改）----------
    # location /ws/ {
    #     proxy_pass http://b_dt_api;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_read_timeout 3600s;
    # }

    # ---------- 带 hash 的构建产物：长缓存 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    # Cesium 离线静态包 / GLB 模型 / CAD 数据：中等缓存（换模型时靠 ?version 刷新）
    location ~* ^/(cesium|models|data)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ---------- SPA 前端路由回退（vue-router history 模式必需）----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# =============================================================================
# 【子路径部署（可选）】若不能占用根路径，需要挂在 /dt/ 下：
#   1) 构建时指定 base：  pnpm build -- --base=/dt/
#   2) 本文件改用下面的 location，并把 root 保持不变：
#
#   location /dt/ {
#       alias /usr/share/nginx/b-dt/;
#       try_files $uri $uri/ /dt/index.html;
#   }
#   location = /dt { return 301 /dt/; }
#   # /api 反代写法不变（API 仍在根 /api，不受子路径影响）
# =============================================================================
