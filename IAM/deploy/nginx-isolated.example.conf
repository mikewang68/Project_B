# Candidate NEW loopback site only. Requires explicit infrastructure authorization.
server {
    listen 127.0.0.1:28188;
    server_name localhost;
    root /srv/b-project-identity/IAM/frontend;
    location /api/v1/iam/ {
        proxy_pass http://127.0.0.1:28184/api/v1/iam/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
