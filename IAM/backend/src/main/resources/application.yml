server:
  address: 127.0.0.1
  port: ${IAM_SERVER_PORT:8081}
  servlet:
    context-path: /api/v1/iam
  encoding:
    charset: UTF-8
    force: true

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: iam-backend
  datasource:
    # openGauss 6.0.5；驱动与 URL 写法与 WMS 模块保持一致（opengauss-jdbc 6.0.0）
    driver-class-name: org.postgresql.Driver
    url: ${IAM_DB_URL}
    username: ${IAM_DB_USER}
    password: ${IAM_DB_PASSWORD}
    hikari:
      pool-name: IamHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 20

app:
  jwt:
    # IAM 独立密钥，只通过 IAM API 持续鉴权，不向其他模块共享
    secret: ${JWT_SECRET:}
    # 有效期（小时）
    expire-hours: ${JWT_EXPIRE_HOURS:12}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174,http://localhost:4174,http://127.0.0.1:4174,http://localhost:5175,http://127.0.0.1:5175}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:disabled}

logging:
  level:
    com.bdemo.iam: info

iam:
  root: ${IAM_ROOT:}
  instance: ${IAM_INSTANCE:}
  instance-allowlist: ${IAM_INSTANCE_ALLOWLIST:}
  isolation-enabled: ${IAM_ISOLATION_ENABLED:true}
  identity:
    config: ${IAM_IDENTITY_CONFIG:}
    idempotency-secret: ${IAM_IDEMPOTENCY_SECRET:}
