<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>B项目 · 设备健康管理系统（EHM）</title>
  <meta name="description" content="设备健康管理系统亮色工业级交互原型" />
  <link rel="stylesheet" href="./styles.css?v=4.0" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">EHM</div>
        <div>
          <strong>设备健康管理系统</strong>
          <span>B项目 · 开发验证环境</span>
        </div>
      </div>

      <div class="site-select">
        <span>当前场站</span>
        <button type="button" id="siteSelect">铁路智慧货场 · 示范区 <b>⌄</b></button>
      </div>

      <nav class="navigation" id="navigation" aria-label="系统功能导航"></nav>

      <div class="sidebar-foot">
        <button class="stack-entry" id="stackEntry" type="button">
          <span class="stack-dot online"></span>
          <span><b>开发底座可用</b><small>8 项基础能力已运行</small></span>
          <i>›</i>
        </button>
        <p>原型数据仅用于界面评审，不代表现场已接入。</p>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle" id="sidebarToggle" aria-label="收起导航" type="button">☰</button>
          <div class="breadcrumb"><span>设备健康管理</span><i>/</i><b id="breadcrumb">综合驾驶舱</b></div>
        </div>
        <div class="topbar-center">
          <label class="global-search">
            <span>⌕</span>
            <input id="globalSearch" placeholder="搜索设备、部件、测点、告警、工单" />
            <kbd>Ctrl K</kbd>
          </label>
        </div>
        <div class="topbar-right">
          <button class="plain-button" id="commandView" type="button">指挥大屏</button>
          <button class="plain-button" id="mobileView" type="button">移动作业端</button>
          <button class="status-button" id="runtimeStatus" type="button"><span></span>系统运行正常</button>
          <button class="icon-button has-count" data-tip="未读告警" type="button" data-goto="alarm-center">告<span>7</span></button>
          <button class="icon-button has-count" data-tip="我的待办" type="button" data-goto="my-tasks">办<span>12</span></button>
          <div class="shift"><b>白班</b><span id="clock">--</span></div>
          <button class="avatar" type="button" aria-label="用户菜单">闫</button>
        </div>
      </header>

      <main class="content" id="content" tabindex="-1">
        <div id="pageView"></div>
      </main>
    </section>
  </div>

  <aside class="context-drawer" id="contextDrawer" aria-hidden="true">
    <div class="drawer-head">
      <div><span id="drawerEyebrow">详情</span><h2 id="drawerTitle">上下文信息</h2></div>
      <button class="drawer-close" id="drawerClose" type="button">×</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot" id="drawerFoot"></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <div class="modal" id="modal" aria-hidden="true">
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><div><span id="modalEyebrow">操作确认</span><h2 id="modalTitle">请确认</h2></div><button id="modalClose" type="button">×</button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </section>
  </div>

  <button class="assistant-entry" id="assistantEntry" type="button" aria-label="打开智能运维助手">
    <span>辅</span><b>智能辅助</b><i>正在连接</i>
  </button>

  <aside class="assistant-panel" id="assistantPanel" aria-hidden="true">
    <div class="assistant-head">
      <div><span>智能运维辅助</span><b>Demo规则 / 外部API可切换</b></div>
      <button id="assistantClose" type="button">×</button>
    </div>
    <div class="capability-notice">
      <strong>当前回答会结合Demo设备、告警和工单数据</strong>
      <p>未配置外部AI时使用可审计规则；配置后由Java后端代理调用。所有回答仍需人工复核。</p>
    </div>
    <div class="assistant-messages" id="assistantMessages">
      <div class="message system">我可以解释当前演示告警、生成检查清单，或说明某项AI能力还缺少哪些启用条件。所有结论均需人工复核。</div>
    </div>
    <div class="assistant-prompts">
      <button type="button">解释GT-01风险</button>
      <button type="button">生成现场检查项</button>
      <button type="button">RUL为何未启用</button>
    </div>
    <form class="assistant-form" id="assistantForm">
      <input id="assistantInput" placeholder="输入问题（仅使用演示数据）" />
      <button type="submit">发送</button>
    </form>
  </aside>

  <div class="toast" id="toast" role="status"></div>

  <script src="./app.js?v=4.0"></script>
  <script id="prototype-fallback">
    document.addEventListener('click', function(event){
      const button = event.target.closest('button');
      if(!button || button.dataset.action || button.dataset.goto || button.dataset.page || button.id || button.classList.contains('nav-parent') || button.closest('.assistant-prompts')) return;
      if(typeof toast === 'function'){
        const label = button.textContent.trim() || '当前按钮';
        if(button.closest('.pagination-buttons')) toast('已切换演示分页；当前原型仅内置第一页虚拟数据。');
        else toast('“' + label + '”已响应；真实业务将在后端接口接入后执行。');
      }
    });
  </script>
</body>
</html>
