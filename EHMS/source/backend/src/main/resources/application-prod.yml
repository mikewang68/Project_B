ehm:
  cors:
    allowed-origins: ${EHM_ALLOWED_ORIGINS}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  data:
    mongodb:
      uri: ${EHM_MONGODB_URI}

server:
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
