server:
  port: ${EHM_SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: ehm-demo
  data:
    mongodb:
      uri: ${EHM_MONGODB_URI:mongodb://ehm_admin:ehm_demo_change_me@localhost:27017/ehm?authSource=admin}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

ehm:
  config:
    path: ${EHM_CONFIG_PATH:../.config.json}
  ai:
    enabled: ${EHM_AI_ENABLED:false}
    base-url: ${EHM_AI_BASE_URL:https://api.deepseek.com}
    api-key: ${EHM_AI_API_KEY:}
    api-key-file: ${EHM_AI_API_KEY_FILE:}
    model: ${EHM_AI_MODEL:deepseek-flash}
    data-policy: ${EHM_AI_DATA_POLICY:disabled}
    timeout-seconds: ${EHM_AI_TIMEOUT_SECONDS:45}
    provider: ${EHM_AI_PROVIDER:}
    trusted-http-origin: ${EHM_AI_TRUSTED_HTTP_ORIGIN:}
    tools-enabled: ${EHM_AI_TOOLS_ENABLED:true}
  security:
    jwt-enabled: ${EHM_JWT_ENABLED:false}
    rbac-enabled: ${EHM_RBAC_ENABLED:false}
    tls-enabled: ${EHM_TLS_ENABLED:false}

logging:
  level:
    root: INFO
    org.mongodb.driver: WARN
