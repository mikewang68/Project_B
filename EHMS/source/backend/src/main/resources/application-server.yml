server:
  port: ${EHM_SERVER_PORT:18083}
  forward-headers-strategy: framework

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
  datasource:
    url: jdbc:postgresql://${EHM_OPENGAUSS_HOST:node4.example.internal}:${EHM_OPENGAUSS_PORT:5432}/${EHM_OPENGAUSS_DATABASE:ehm}
    username: ${EHM_OPENGAUSS_USERNAME}
    password: ${EHM_OPENGAUSS_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${EHM_DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${EHM_DB_POOL_MAX_SIZE:20}
      connection-timeout: 5000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    mongodb:
      repositories:
        type: none

ehm:
  sample-data:
    enabled: ${EHM_SAMPLE_DATA_ENABLED:false}
  auth:
    mode: ${EHM_AUTH_MODE:local}
    bootstrap-file: ${EHM_AUTH_BOOTSTRAP_FILE:}
    table-prefix: ${EHM_AUTH_TABLE_PREFIX:auth_}
    cookie-name: ${EHM_AUTH_COOKIE_NAME:EHM_SESSION}
    cookie-secure: ${EHM_AUTH_COOKIE_SECURE:true}
    session-hours: ${EHM_AUTH_SESSION_HOURS:8}
    idle-minutes: ${EHM_AUTH_IDLE_MINUTES:30}
  audit:
    domain: ${EHM_AUDIT_DOMAIN:unassigned}
    zone: ${EHM_AUDIT_ZONE:unassigned}
    endpoint: ${EHM_AUDIT_ENDPOINT:}
    token-file: ${EHM_AUDIT_TOKEN_FILE:}
    interval-ms: ${EHM_AUDIT_INTERVAL_MS:5000}
    iam-me-url: ${EHM_AUDIT_IAM_ME_URL:}
    iam-required: ${EHM_AUDIT_IAM_REQUIRED:false}
    task-max-seconds: ${EHM_AUDIT_TASK_MAX_SECONDS:900}
    evidence-export-enabled: ${EHM_AUDIT_EVIDENCE_EXPORT_ENABLED:false}
    evidence-export-actors: ${EHM_AUDIT_EVIDENCE_EXPORT_ACTORS:}
    query-actors: ${EHM_AUDIT_QUERY_ACTORS:}
    reader-token-file: ${EHM_AUDIT_READER_TOKEN_FILE:}
    outbox-table: ${EHM_AUDIT_OUTBOX_TABLE:audit_outbox}
    task-table: ${EHM_AUDIT_TASK_TABLE:audit_task}
  release:
    version: 1.8.1-server
  cors:
    allowed-origins: ${EHM_ALLOWED_ORIGINS:http://192.0.2.74:18090}
  persistence:
    adapter: ${EHM_PERSISTENCE_ADAPTER:openGauss}
    schema: ${EHM_OPENGAUSS_SCHEMA:ehm}
    table: ${EHM_OPENGAUSS_TABLE:aggregate_store}
    auto-ddl: ${EHM_OPENGAUSS_AUTO_DDL:false}
  telemetry:
    adapter: ${EHM_TELEMETRY_ADAPTER:openGemini}
    base-url: ${EHM_OPENGEMINI_BASE_URL:http://node6.example.internal:8086}
    database: ${EHM_OPENGEMINI_DATABASE:ehm_telemetry}
    username: ${EHM_OPENGEMINI_USERNAME:}
    password: ${EHM_OPENGEMINI_PASSWORD:}
    connect-timeout: 5s
    read-timeout: 15s
    write-enabled: ${EHM_OPENGEMINI_WRITE_ENABLED:true}

logging:
  level:
    root: INFO
    com.bproject.ehm.monitoring.adapter.out.opengemini: INFO
