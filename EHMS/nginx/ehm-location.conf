# 公开示例：将本片段合并到Web节点统一入口的server块中，不要覆盖其他站点或整份Nginx配置。
location = /ehm {
    return 301 /ehm/;
}

location /ehm/ {
    alias /srv/b-project/ehm/web/;
    try_files $uri $uri/ /ehm/index.html;
}

location /api/ehm/health/ {
    proxy_pass http://node4.example.internal:18083/health/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
}

location /api/ehm/ {
    proxy_pass http://node4.example.internal:18083/api/ehm/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Trace-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
}
