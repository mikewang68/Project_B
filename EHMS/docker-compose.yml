name: ehm-demo

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-ehm_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-ehm_demo_change_me}
      MONGO_INITDB_DATABASE: ehm
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ehm_mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      EHM_SERVER_PORT: 8080
      EHM_CONFIG_PATH: /app/config/.config.json
      EHM_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-ehm_admin}:${MONGO_ROOT_PASSWORD:-ehm_demo_change_me}@mongo:27017/ehm?authSource=admin
      EHM_AI_ENABLED: ${EHM_AI_ENABLED:-false}
      EHM_AI_BASE_URL: ${EHM_AI_BASE_URL:-}
      EHM_AI_API_KEY: ${EHM_AI_API_KEY:-}
      EHM_AI_MODEL: ${EHM_AI_MODEL:-}
    volumes:
      - ./.config.json:/app/config/.config.json:ro
    ports:
      - "${EHM_BACKEND_PORT:-8080}:8080"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${EHM_WEB_PORT:-8088}:80"
    depends_on:
      - backend

volumes:
  ehm_mongo_data:
