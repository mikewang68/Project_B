name: IAM V2 source integration

on:
  pull_request:
    paths:
      - 'IAM/**'
      - 'SYS/**'
      - 'PSMS/**'
      - 'WMS/**'
      - 'EHMS/**'
      - 'EMCS/**'
      - 'TRUST/**'
      - 'AUDIT/client/**'
      - 'deploy/isolated-gateway/**'
      - '.github/workflows/iam-v21-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iam-v21-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [IAM/backend, SYS/backend, WMS, EHMS/source/backend, EMCS/backend-java, TRUST/backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install shared source dependencies
        run: |
          mvn -B -f AUDIT/pom.xml -pl client -am -DskipTests install
          mvn -B -f IAM/context-client/pom.xml -DskipTests install
      - name: Compile application and test sources
        working-directory: ${{ matrix.module }}
        run: mvn -B -DskipTests -Dexec.skip=true package
      - name: Verify environment-independent IAM guards
        if: matrix.module == 'IAM/backend'
        run: mvn -B -f IAM/backend/pom.xml -Dtest=IdentityIsolationGuardTest,ScopeSqlTest,NativeScopeReadinessTest,ScopeWorkspaceServiceTest,ScopeManagementOrganizationsTest,ScopeRouteInterceptorTest,NavigationAddressProjectionTest,ScopeProjectRoleVisibilityTest,UserReadScopeTest -Dsurefire.failIfNoSpecifiedTests=false test

  project-workspace-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Project selection and navigation guards
        run: |
          node --test IAM/tests/project-workspace.test.mjs IAM/tests/scope-selection.test.mjs
          node TRUST/tests/portal-workspace.cjs
          node TRUST/tests/portal-addresses.cjs
      - name: Authorized database refresh and editing guards
        run: node --test EHMS/tests/central-scope-policy.test.cjs EHMS/tests/central-scope-dashboard.test.cjs EHMS/tests/live-read.test.cjs
      - name: SSO workspace transaction binding
        working-directory: deploy/isolated-gateway
        run: python -m unittest test_cross_domain_sso test_gateway_routes

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - name: Build context SDK
        working-directory: IAM/context-client-ts
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm build
          pnpm test
      - name: Compile PSMS backend
        working-directory: PSMS/backend
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {module: IAM, command: build}
          - {module: SYS, command: build}
          - {module: PSMS, command: build}
          - {module: WMS/frontend, command: verify-and-build}
          - {module: EMCS/web, command: 'build:prod'}
          - {module: TRUST/frontend, command: build}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - name: Install locked dependencies and build
        working-directory: ${{ matrix.module }}
        run: |
          if [ '${{ matrix.module }}' = PSMS ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --ignore-workspace --frozen-lockfile
          fi
          pnpm run '${{ matrix.command }}'
      - name: PSMS database page tests
        if: matrix.module == 'PSMS'
        working-directory: PSMS
        run: pnpm exec vitest run src/real
      - name: TRUST authorized refresh browser fixtures
        if: matrix.module == 'TRUST/frontend'
        working-directory: TRUST/frontend
        run: |
          pnpm test:unit
          pnpm exec playwright install --with-deps chromium
          python3 -m http.server 28388 --bind 127.0.0.1 --directory dist > /tmp/trust-refresh-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:28388/ > /dev/null; then break; fi
            sleep 1
          done
          TRUST_TEST_BUNDLED_CHROMIUM=1 node ../tests/manual-refresh-ui.cjs
