# 服务器 profile（bpoc-node4 / bpoc-node5）：所有连接信息只来自环境变量（EnvironmentFile）。
# 启动：java -jar safety-gate-service.jar --spring.profiles.active=server
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${OPENGAUSS_JDBC_URL:jdbc:postgresql://${OPENGAUSS_HOST}:${OPENGAUSS_PORT}/${OPENGAUSS_DATABASE}?currentSchema=safety}
    username: ${OPENGAUSS_USERNAME}
    password: ${OPENGAUSS_PASSWORD}
    hikari:
      # 服务器上启动即验证数据库连接，连不上则 readiness DOWN（配合 Restart 策略）
      initialization-fail-timeout: 5000
      maximum-pool-size: ${OPENGAUSS_POOL_MAX:10}
  data:
    redis:
      host: ${KVROCKS_HOST}
      port: ${KVROCKS_PORT}
      password: ${KVROCKS_PASSWORD:}
      database: ${KVROCKS_DATABASE:0}

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
    api-key: ${APP_SECURITY_API_KEY}
    # 静态令牌已停用，保留占位以便显式拒绝误配置
    bearer-token: ${APP_SECURITY_BEARER_TOKEN:}
    jwt-secret: ${APP_SECURITY_JWT_SECRET:}
    jwt-issuer: ${APP_SECURITY_JWT_ISSUER:}
    jwt-clock-skew-seconds: ${APP_SECURITY_JWT_CLOCK_SKEW_SECONDS:60}
    jwt-public-key-pem: ${APP_SECURITY_JWT_PUBLIC_KEY_PEM:}
    jwt-jwks-url: ${APP_SECURITY_JWT_JWKS_URL:}
    jwt-allowed-algorithms: ${APP_SECURITY_JWT_ALLOWED_ALGORITHMS:HS256,HS384,HS512}
    ws-auth-enabled: ${APP_SECURITY_WS_AUTH_ENABLED:true}
    iam-base-url: ${APP_SECURITY_IAM_BASE_URL:}
    iam-service-token: ${APP_SECURITY_IAM_SERVICE_TOKEN:}
    iam-audience: ${APP_SECURITY_IAM_AUDIENCE:scs}
    sso-bindings-file: ${SCS_SSO_BINDINGS_FILE:}
    iam-timeout-ms: ${APP_SECURITY_IAM_TIMEOUT_MS:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:true}
    name-server: ${ROCKETMQ_NAMESRV_ADDR}
    producer-group: ${ROCKETMQ_PRODUCER_GROUP:safety-control-demo-producer}
  opengemini:
    enabled: ${OPENGEMINI_ENABLED:true}
    base-url: ${OPENGEMINI_URL}
