# 本地开发 profile（默认）：允许在 openGauss/Kvrocks 未启动时也能把应用跑起来，
# 此时 /health/live 为 UP、/health/ready 会把对应组件标为 DOWN。
spring:
  datasource:
    hikari:
      # 不在启动阶段强制建连，避免本地无数据库时应用无法启动
      initialization-fail-timeout: -1
      connection-timeout: 2000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:4178,http://127.0.0.1:4178}
  # 本地默认不连 RocketMQ / openGemini；需要联调时用环境变量打开
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:false}
  opengemini:
    enabled: ${OPENGEMINI_ENABLED:false}

logging:
  level:
    com.bproject.safety: DEBUG
