<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#065a82" />
    <title>B项目 · 装卸作业安全卡控</title>
    <!--
      票据擦除：必须在任何模块（含 vue-router）初始化之前执行。
      SSO 跳转会把一次性票据放在 ?sso_ticket=，若不立即从地址栏移除，
      它会进入浏览器历史、截图和分享链接。这里先取出存到 window 上，
      再由 session.ts 消费，保证 URL 在首帧就已干净。
    -->
    <script>
      (function () {
        try {
          var u = new URL(window.location.href);
          var t = u.searchParams.get('sso_ticket');
          if (t) {
            window.__scsSsoTicket = t;
            u.searchParams.delete('sso_ticket');
            window.history.replaceState({}, '', u.toString());
          }
        } catch (e) { /* 忽略：极旧浏览器 */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
