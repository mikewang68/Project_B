# 基础设施容器化：只跑 MySQL + Redis（Spring Boot 使用 Redis 做验证码/会话支撑）。
# 应用代码（Spring Boot / Vite）本机跑；数据库镜像、库名和数据卷在重构中保持不变。
# 重置演示数据：docker compose down -v && docker compose up -d && python datagen/generate_demo_data.py
services:
  mysql:
    image: mysql:8.4
    container_name: bdemo-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: bdemo_root
      MYSQL_DATABASE: b_demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: bdemo_dev
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pbdemo_root"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bdemo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
