# Include inside the existing node6 Nginx server {}. Preserve other applications.
# Static files are installed at /srv/www/emcs/.
location = /emcs { return 301 /emcs/; }
location /emcs/ {
    root /srv/www;
    index index.html;
    try_files $uri $uri/ /emcs/index.html;
}
location = /emcs/index.html {
    root /srv/www;
    add_header Cache-Control "no-cache";
}
location /emcs-api/ {
    proxy_pass http://192.168.101.57:18103/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 180s;
    client_max_body_size 20m;
}
