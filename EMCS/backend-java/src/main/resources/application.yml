server:
  port: ${APP_PORT:18103}
  servlet:
    context-path: ${APP_ROOT_PATH:}

spring:
  config:
    import: "classpath:agent-defaults.yml,optional:file:./config/agent.yml"
  application:
    name: b-demo-server
  datasource:
    url: jdbc:opengauss://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_DATABASE:emcs}?stringtype=unspecified
    username: ${DB_USERNAME:emcs}
    password: ${DB_PASSWORD:}
    driver-class-name: org.opengauss.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
      connection-init-sql: "SET TIME ZONE 'Asia/Shanghai'"
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

b-demo:
  demo-now: ${DEMO_NOW:2026-07-12T23:59:00}
  scheduling-enabled: ${SCHEDULING_ENABLED:false}
  cache-prefix: ${CACHE_PREFIX:emcs:}
  auth:
    captcha-enabled: ${CAPTCHA_ENABLED:true}
    register-enabled: false
    jwt-secret: ${JWT_SECRET_KEY:change-this-development-secret-change-this-development-secret}
    token-minutes: ${JWT_EXPIRE_MINUTES:120}
