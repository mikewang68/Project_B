<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>统一操作日志</title>
<style>body{margin:0;background:#f4f6f8;color:#263238;font:14px "Microsoft YaHei",Arial,sans-serif}header{background:#fff;border-bottom:1px solid #dce2e8;padding:22px 28px}h1{font-size:22px;margin:0 0 8px}main{padding:24px 28px}.note{color:#64748b;margin:8px 0;line-height:1.7}.toolbar,.summary{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:18px;background:white;border:1px solid #e0e5ea;margin-bottom:16px}input,button,select{font:inherit;padding:9px;border:1px solid #ccd4dc;border-radius:4px}button{background:#fff;cursor:pointer}button.primary{background:#2563ab;color:white;border-color:#2563ab}button:disabled{opacity:.45;cursor:not-allowed}input[type=password]{min-width:300px}table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:12px;border-bottom:1px solid #e3e8ed;white-space:nowrap}th{background:#eaf0f6;color:#334155}.table-wrap{overflow:auto;border:1px solid #dde4eb}.status{padding:4px 7px;background:#edf2f7;border-radius:3px}.good{background:#e7f5ee;color:#236340}.warn{background:#fff3df;color:#986317}.error{color:#a22222}dialog{max-width:800px;width:80%;border:1px solid #ccd4dc;border-radius:6px}pre{white-space:pre-wrap;word-break:break-all;max-height:65vh;overflow:auto}.footer{display:flex;gap:12px;align-items:center;margin-top:16px}</style></head>
<body><header><h1>统一操作日志</h1><div class="note">记录业务操作、访问与任务结果。日志入库和链上确认分别展示。</div></header><main>
<section class="toolbar"><label>只读访问凭据 <input id="credential" type="password" autocomplete="off" placeholder="仅用于本地联调；不要填模块写入凭据"></label><button id="connect" class="primary">连接日志服务</button><span id="identity">未连接</span></section>
<p class="note">凭据只在当前页面内存保存，刷新即清除。正式接入 SYS 时由其后端验证 IAM 会话并代理请求，不向浏览器分发服务写入密钥。</p>
<section class="toolbar"><label>模块 <input id="app" placeholder="例如 ehealth，空白为授权范围全部"></label><label>操作 <select id="action"><option value="">全部</option></select></label><label>用户 <input id="user" placeholder="用户ID"></label><button id="search">查询</button><button id="export" disabled>导出最近100条 CSV</button></section>
<section class="summary"><strong id="total">记录数：—</strong><span id="message">请选择授权范围并查询。</span></section>
<div class="table-wrap"><table><thead><tr><th>操作时间</th><th>模块 / 菜单</th><th>用户 / 身份可信度</th><th>动作 / 来源</th><th>执行结果</th><th>上链状态</th><th>交易编号</th><th>详情 / 回执</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="footer"><button id="previous">上一页</button><span id="page">第1页</span><button id="next">下一页</button></div>
<p class="note">NOT_CONFIGURED 表示尚未配置区块链日志接口；ACCEPTED 表示链服务已接收；只有 COMMITTED 且有有效回执才表示链上确认。CLIENT/STARTED 是前端操作意图，不证明业务完成。</p>
</main><dialog id="detail"><button id="close">关闭</button><pre id="json"></pre></dialog><script src="console.js"></script></body></html>
