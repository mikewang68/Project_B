server:
  port: ${SYS_SERVER_PORT:8082}
  servlet:
    context-path: /api/v1/sys
  encoding:
    charset: UTF-8
    force: true

spring:
  application:
    name: sys-backend
  datasource:
    # openGauss 6.0.5；驱动与 URL 写法与 WMS 模块保持一致（opengauss-jdbc 6.0.0）
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:project_b}?currentSchema=sys&ApplicationName=sys-backend&reWriteBatchedInserts=true
    username: ${DB_USER:sys_app}
    password: ${DB_PASSWORD:change-me}
    hikari:
      pool-name: SysHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 20

app:
  jwt:
    # 遗留 Bearer 验证器；原生 SSO 使用独立服务凭据，无须共享 IAM 签名密钥
    secret: ${JWT_SECRET:dev-only-iam-sys-jwt-secret-please-change-in-production-0123456789}
    expire-hours: ${JWT_EXPIRE_HOURS:12}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5175,http://127.0.0.1:5175,http://localhost:4176,http://127.0.0.1:4176,http://localhost:5174,http://127.0.0.1:5174}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:disabled}

sys:
  audit:
    public:
      enabled: ${SYS_PUBLIC_AUDIT_ENABLED:false}
      endpoint: ${SYS_PUBLIC_AUDIT_ENDPOINT:}
      token-file: ${SYS_PUBLIC_AUDIT_TOKEN_FILE:}
      domain: ${SYS_PUBLIC_AUDIT_DOMAIN:B-PROJECT}
      zone: ${SYS_PUBLIC_AUDIT_ZONE:DL-PORT}
      since: ${SYS_PUBLIC_AUDIT_SINCE:}
      interval-ms: ${SYS_PUBLIC_AUDIT_INTERVAL_MS:5000}

logging:
  level:
    com.bdemo.sys: info
